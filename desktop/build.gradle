plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.blockcorn.desktop.Main'
}

dependencies {
    implementation project(':core')
    // JNA for Windows registry access + macOS helpers
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    // OkHttp for blocklist fetching (simpler than java.net.http for background threads)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'blockcorn-desktop'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    // Fat JAR — bundle all deps
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Separate fat JAR for the external watchdog process
tasks.register('watchdogJar', Jar) {
    group = 'build'
    description = 'Builds the standalone watchdog fat JAR'
    archiveBaseName = 'blockcorn-watchdog'
    manifest {
        attributes 'Main-Class': 'com.blockcorn.desktop.WatchdogMain'
    }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

assemble.dependsOn watchdogJar
